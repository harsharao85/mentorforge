services:
  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - mentorforge_net

  neo4j-init:
    image: neo4j:5.26.0-community
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        cypher-shell -u neo4j -p "$NEO4J_PASSWORD" -a bolt://neo4j:7687 \
          --file /init/01_schema.cypher
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./neo4j/init:/init:ro
    networks:
      - mentorforge_net
    restart: "no"

  # ── linux profile only ───────────────────────────────────────────────────────
  # On Apple Silicon (Mac demo host), Ollama runs natively with Metal acceleration.
  # These two services are excluded from the default profile so `docker compose up`
  # does NOT start a containerized Ollama (which would be CPU-only on Apple Silicon).
  # Linux / customer path: docker compose --profile linux up
  # Mac path: docker compose up neo4j  (Ollama native, GraphRAG native — see ingest_native.sh)
  ollama:
    image: ollama/ollama:0.5.13
    profiles: ["linux"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mentorforge_net

  # One-shot: pulls llama3.3:70b and nomic-embed-text on first boot (~40 GB total).
  # Subsequent compose-up calls skip re-download if the volume already has the models.
  ollama-init:
    image: ollama/ollama:0.5.13
    profiles: ["linux"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull llama3.3:70b && ollama pull nomic-embed-text
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - mentorforge_net
    restart: "no"

  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Linux: http://ollama:11434 (container DNS)
      # Mac:   export OLLAMA_BASE_URL=http://host.docker.internal:11434 before compose up
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mentorforge_net

  # Run the GraphRAG indexer against the /input directory (Linux/container path).
  # Usage: docker compose --profile linux --profile indexer run --rm graphrag-indexer
  # Mac path: use graphrag/scripts/ingest_native.sh instead (native venv, Metal Ollama).
  graphrag-indexer:
    build:
      context: ./graphrag
      dockerfile: Dockerfile
    profiles: ["indexer"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHRAG_API_KEY: "ollama"
    volumes:
      - ./graphrag/input:/app/input:ro
      - graphrag_output:/app/output
      - graphrag_cache:/app/cache
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - mentorforge_net

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_models:
  graphrag_output:
  graphrag_cache:

networks:
  mentorforge_net:
    driver: bridge
